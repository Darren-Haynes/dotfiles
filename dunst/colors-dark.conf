# Bubblegum (dark)
[global]
    frame_color = "#d7afd7"
    separator_color = frame
    highlight = "#d7afd7"
    icon_theme = "Colloid-Bubblegum-Dark"

[urgency_low]
    background = "#2a2a2a"
    foreground = "#a7a7a7"
    frame_color = "#454545"
    highlight = "#d7afd7"

[urgency_normal]
    background = "#2a2a2a"
    foreground = "#d7d7d7"
    frame_color = "#d7afd7"
    highlight = "#d7afd7"

[urgency_critical]
    background = "#2a2a2a"
    foreground = "#ffffff"
    frame_color = "#d78787"
    highlight = "#d78787"
