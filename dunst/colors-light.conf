# Bubblegum Light
[global]
    frame_color = "#b060a0"
    separator_color = frame
    highlight = "#b060a0"
    icon_theme = "Colloid-Bubblegum-Light"

[urgency_low]
    background = "#f5f5f5"
    foreground = "#5a5a5a"
    frame_color = "#c8c8c8"
    highlight = "#b060a0"

[urgency_normal]
    background = "#f5f5f5"
    foreground = "#2a2a2a"
    frame_color = "#b060a0"
    highlight = "#b060a0"

[urgency_critical]
    background = "#f5f5f5"
    foreground = "#2a2a2a"
    frame_color = "#c0504d"
    highlight = "#c0504d"
