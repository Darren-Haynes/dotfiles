# ==============================================================================
# Foot Minimalist Bubblegum Environment Profile
# Fully Optimized for Foot v1.27.0 Rulesets
# ==============================================================================

[main]
font=Fira Code:size=12
font-bold=Fira Code:style=Bold:size=12   
initial-window-size-pixels=1800x1000
resize-keep-grid=no
pad=20x20 center
# Written by sway/toggle-theme.sh (sets initial-color-theme=dark|light) so new
# windows open in the current theme. install.sh seeds it; foot refuses to
# start if an include is missing.
include=~/.local/state/foot/theme.ini

[cursor]
style=block
blink=no

[colors-dark]
background=2a2a2a
foreground=d7d7d7

# FIX: Combined single line syntax. First value = Text, Second value = Cursor block!
cursor=2a2a2a 87d7ff

selection-background=3a3a3a
selection-foreground=ffffff

regular0=2a2a2a
regular1=d78787
regular2=87d7ff
regular3=e5e5e5
regular4=87d7ff
regular5=d7afd7
regular6=87d7ff
regular7=d7d7d7

bright0=454545
bright1=d78787
bright2=87d7ff
bright3=ffffff
bright4=87d7ff
bright5=d7afd7
bright6=87d7ff
bright7=ffffff

# Bubblegum Light: same palette as nvim/neovim-bubblegum, GTK "Bubblegum Light"
# and dunst (#f5f5f5 background, #b060a0 pink, #0088cc blue).
[colors-light]
background=f5f5f5
foreground=2a2a2a

cursor=f5f5f5 0088cc

selection-background=d5d5d5
selection-foreground=2a2a2a

regular0=2a2a2a
regular1=c0504d
regular2=0088cc
regular3=666666
regular4=0088cc
regular5=b060a0
regular6=0088cc
regular7=5a5a5a

bright0=888888
bright1=c0504d
bright2=0088cc
bright3=2a2a2a
bright4=0088cc
bright5=b060a0
bright6=0088cc
bright7=2a2a2a
