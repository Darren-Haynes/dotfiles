# ==============================================================================
# Foot Minimalist Environment Profile (Bubblegum / shhhed colours: see colors-*.ini)
# Fully Optimized for Foot v1.27.0 Rulesets
# ==============================================================================

[main]
font=Fira Code:size=12
font-bold=Fira Code:style=Bold:size=12
initial-window-size-pixels=1800x1000
resize-keep-grid=no
pad=2x2 center
# Written by sway/apply-foot-colors.sh (initial-color-theme plus the active
# family's [colors-dark]/[colors-light] from foot/colors-<family>.ini) so new
# windows open in the current theme. install.sh seeds it; foot refuses to
# start if an include is missing.
include=~/.local/state/foot/theme.ini

[cursor]
style=block
blink=no
