# Milo palette for foot, from the Milo Zed theme (terminal.ansi.*); the light
# variant is derived (see zed/themes/milo/derive-light.py).
# The cursor accent placeholder is filled in by sway/apply-foot-colors.sh, and
# the file is combined with the dark/light choice into ~/.local/state/foot/theme.ini.

[colors-dark]
