# ==============================================================================
# Yazi Modular Configuration Settings
# Optimized for koalefant's dark monochrome + ice-blue palette layout
# ==============================================================================

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Neovim" }
]
# Cleanly define swayimg as an independent task that unhooks from the terminal sandbox
view_image = [
    { run = 'swayimg --class=floating-viewer "$@"', block = false, orphan = true, desc = "Open floating image viewer" }
]

[open]
prepend_rules = [
	# 1. Force the native image MIME types to hit your new swayimg ruleset layout first
	{ mime = "image/*", use = "view_image" },

	# Source code and text files via MIME type
	{ mime = "text/*", use = "edit" },
	{ mime = "application/x-javascript", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/xml", use = "edit" },
	{ mime = "application/toml", use = "edit" },
	{ mime = "application/yaml", use = "edit" },

	# Fallback extension matching using 'url'
	{ url = "*.rs", use = "edit" },
	{ url = "*.lua", use = "edit" },
	{ url = "*.ts", use = "edit" },
	{ url = "*.tsx", use = "edit" },
	{ url = "*.astro", use = "edit" }
]

[preview]
preview_method = "sixel"
max_width = 1920
max_height = 1080

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[manager]
linemode = "none"
# FIX: Safely closed with your original layout panel scaling proportions
ratio = [1, 3, 2]
