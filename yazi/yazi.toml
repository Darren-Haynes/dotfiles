[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Neovim" }
]

[open]
prepend_rules = [
	# Source code and text files via MIME type
	{ mime = "text/*", use = "edit" },
	{ mime = "application/x-javascript", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/xml", use = "edit" },
	{ mime = "application/toml", use = "edit" },
	{ mime = "application/yaml", use = "edit" },

	# Fallback extension matching using 'url'
	{ url = "*.rs", use = "edit" },
	{ url = "*.lua", use = "edit" },
	{ url = "*.ts", use = "edit" },
	{ url = "*.tsx", use = "edit" },
	{ url = "*.astro", use = "edit" }
]

[preview]
max_width = 1920
max_height = 1080

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

